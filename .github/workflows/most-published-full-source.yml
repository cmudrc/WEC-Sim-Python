name: MATLAB MOST published full-duration source

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          sparse-checkout: MOST
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody Stateflow Optimization_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(fullfile(pwd,'matlab-ref','source'))); cd('applications/MOST/hydroData'); bemio; cd('../../..'); assert(isfile('applications/MOST/hydroData/VolturnUS.h5'))
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('applications/MOST/mostData/windTurbine/turbine_properties'); WTproperties_IEA15MW; BladeData_IEA15MW; cd('../control'); Steady_States_IEA15MW; Controller_IEA15MW; cd('../../../../..')
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(fullfile(pwd,'matlab-ref','source'))); addpath(fullfile(pwd,'tests','matlab')); most_wind_advection_baseline(20750); most_short_source_baseline(1000, 0.1); source=load('matlab-most-short.mat','body_time','wave_time'); assert(numel(source.body_time)==10001); assert(abs(source.body_time(end)-1000)<1e-9); assert(max(abs(diff(source.body_time)-0.1))<1e-9)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_most_published_full_inputs.py
        env:
          WEC_SIM_MOST_FULL_SOURCE: matlab-most-short.mat
          WEC_SIM_MOST_H5: applications/MOST/hydroData/VolturnUS.h5
          WEC_SIM_MOST_BTS: applications/MOST/mostData/turbSim/WIND_8mps.bts
          WEC_SIM_MOST_CONTROL: applications/MOST/mostData/windTurbine/control/Control_IEA15MW.mat
          WEC_SIM_MOST_STEADY_STATES: applications/MOST/mostData/windTurbine/control/SteadyStates_IEA15MW.mat
      - run: sha256sum applications/MOST/mostData/turbSim/WIND_8mps.bts > most-published-input-sha256.txt
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-most-published-1000s
          if-no-files-found: warn
          path: |
            matlab-most-short.mat
            most-published-input-sha256.txt
            applications/MOST/hydroData/VolturnUS.h5
            applications/MOST/hydroData/Mass_Inertia_Properties.mat
            applications/MOST/mostData/windTurbine/control/Control_IEA15MW.mat
            applications/MOST/mostData/windTurbine/control/SteadyStates_IEA15MW.mat
            applications/MOST/mostData/windTurbine/turbine_properties/Properties_IEA15MW.mat
