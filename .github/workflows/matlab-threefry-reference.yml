name: MATLAB Threefry phase reference

on:
  push:
    branches: [matlab-threefry-seed-audit]
  workflow_dispatch:

jobs:
  phase-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); threefry_reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-threefry-phase-reference
          path: matlab-threefry-output/
