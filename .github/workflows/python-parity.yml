name: Python parity

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q source/objects
      - run: python -m pytest -q tests/test_wave_parity.py tests/test_body_io.py
