name: Python parity

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - run: cd /tmp && python -c 'from wecsim import WEC; print(WEC.__module__)'
      - run: python -m compileall -q wecsim
      - run: python -m pytest -q
