name: MATLAB reference model baselines

on:
  push:
    paths:
      - '.github/workflows/reference-model-baselines.yml'
      - 'tests/matlab/reference_model_baseline.m'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [RM3, OSWEC, Sphere]
    name: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: |
            source
            examples/${{ matrix.model }}
      - uses: actions/checkout@v7
        if: matrix.model == 'Sphere'
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/Sphere
            Free_Decay
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('${{ matrix.model }}')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-${{ matrix.model }}-baseline
          path: matlab-reference-model-output/
