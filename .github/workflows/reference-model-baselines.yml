name: MATLAB reference model baselines

on:
  push:
    paths:
      - '.github/workflows/reference-model-baselines.yml'
      - 'tests/matlab/reference_model_baseline.m'
      - 'tests/test_live_sphere_io.py'
      - 'tests/test_live_current_h5.py'
      - 'tests/test_rm3_heave_dynamics_parity.py'
      - 'tests/test_rm3_multidof_parity.py'
      - 'tests/test_rm3_b2b_parity.py'
      - 'tests/test_rm3_b2b_cic_parity.py'
      - 'tests/test_rm3_mcr_parity.py'
      - 'tests/test_sphere_pto_config_parity.py'
      - 'tests/test_case_dynamics_parity.py'
      - 'tests/test_oswec_hinge_dynamics_parity.py'
      - 'tests/test_oswec_nonhydro_parity.py'
      - 'tests/test_oswec_irregular_wave_parity.py'
      - 'tests/test_sphere_dynamics_parity.py'
      - 'wecsim/linearHeave.py'
      - 'wecsim/hingePitch.py'
      - 'wecsim/irregularWave.py'
      - 'wecsim/rm3Regular.py'
      - 'wecsim/generalDynamics.py'
      - 'wecsim/caseDynamics.py'
      - 'wecsim/cli.py'
      - 'wecsim/bodyClass.py'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [RM3, OSWEC, OSWEC_Nonhydro, Sphere, RM3_B2B, RM3_PTO_Extension, Sphere_Passive, Sphere_PTO_Config, RM3_MCR]
    name: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: |
            source
            examples/${{ matrix.model }}
      - uses: actions/checkout@v7
        if: matrix.model == 'Sphere' || matrix.model == 'Sphere_Passive' || matrix.model == 'Sphere_PTO_Config' || matrix.model == 'RM3_B2B' || matrix.model == 'RM3_PTO_Extension' || matrix.model == 'RM3_MCR' || matrix.model == 'OSWEC_Nonhydro'
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/Sphere
            Free_Decay
            _Common_Input_Files/RM3
            _Common_Input_Files/OSWEC
            Nonhydro_Body
            Body-to-Body_Interactions/B2B_Case1
            Body-to-Body_Interactions/B2B_Case2
            Body-to-Body_Interactions/B2B_Case3
            Body-to-Body_Interactions/B2B_Case4
            RM3_PTO_Extension
            Controls/Passive (P)
            Multiple_Condition_Runs/RM3_MCROPT1
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: ${{ (matrix.model == 'Sphere_Passive' || matrix.model == 'Sphere_PTO_Config') && 'Simulink Simscape Simscape_Multibody Control_System_Toolbox' || 'Simulink Simscape Simscape_Multibody' }}
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('${{ matrix.model }}')
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_case_dynamics_parity.py
        env:
          WEC_SIM_REFERENCE_MODEL: ${{ matrix.model }}
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_live_current_h5.py
        if: matrix.model == 'RM3' || matrix.model == 'OSWEC'
        env:
          WEC_SIM_REFERENCE_MODEL: ${{ matrix.model }}
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
      - run: python -m pytest -q tests/test_rm3_heave_dynamics_parity.py
        if: matrix.model == 'RM3'
        env:
          WEC_SIM_REFERENCE_MODEL: RM3
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_multidof_parity.py
        if: matrix.model == 'RM3'
        env:
          WEC_SIM_REFERENCE_MODEL: RM3
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_b2b_parity.py
        if: matrix.model == 'RM3_B2B'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_b2b_cic_parity.py
        if: matrix.model == 'RM3_B2B'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_mcr_parity.py
        if: matrix.model == 'RM3_MCR'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_oswec_hinge_dynamics_parity.py
        if: matrix.model == 'OSWEC'
        env:
          WEC_SIM_REFERENCE_MODEL: OSWEC
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_oswec_nonhydro_parity.py
        if: matrix.model == 'OSWEC_Nonhydro'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_oswec_irregular_wave_parity.py
        if: matrix.model == 'OSWEC'
        env:
          WEC_SIM_REFERENCE_MODEL: OSWEC
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_live_sphere_io.py tests/test_sphere_dynamics_parity.py
        if: matrix.model == 'Sphere'
        env:
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_sphere_passive_parity.py
        if: matrix.model == 'Sphere_Passive'
        env:
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_sphere_pto_config_parity.py
        if: matrix.model == 'Sphere_PTO_Config'
        env:
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-${{ matrix.model }}-baseline
          path: |
            matlab-reference-model-output/
            applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
            applications/_Common_Input_Files/RM3/hydroData/rm3.h5
            applications/_Common_Input_Files/OSWEC/hydroData/oswec.h5
