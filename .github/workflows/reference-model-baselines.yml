name: MATLAB reference model baselines

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/reference-model-baselines.yml'
      - 'tests/matlab/reference_model_baseline.m'
      - 'tests/test_live_sphere_io.py'
      - 'tests/test_live_current_h5.py'
      - 'tests/test_rm3_heave_dynamics_parity.py'
      - 'tests/test_rm3_multidof_parity.py'
      - 'tests/test_rm3_b2b_parity.py'
      - 'tests/test_rm3_b2b_cic_parity.py'
      - 'tests/test_rm3_radiation_diagnostic.py'
      - 'tools/rm3_radiation_diagnostic.py'
      - 'tests/test_rm3_end_stops_parity.py'
      - 'tests/test_rm3_end_stops_step_diagnostic.py'
      - 'tests/test_rm3_end_stops_source_convergence.py'
      - 'tests/test_rm3_end_stops_trajectory_parity.py'
      - 'tests/test_rm3_radiation_options_parity.py'
      - 'tests/test_rm3_pto_extension_parity.py'
      - 'tests/test_rm3_mcr_parity.py'
      - 'tests/test_rm3_public_floating_joint_parity.py'
      - 'tests/test_rm3_mcr_orchestration_parity.py'
      - 'tests/test_rm3_mcr_seastate_parity.py'
      - 'tests/test_rm3_mooring_source.py'
      - 'tests/test_rm3_mooring_parity.py'
      - 'tests/test_rm3_public_mooring_parity.py'
      - 'tests/test_sphere_mean_drift_source.py'
      - 'tests/test_sphere_mean_drift_parity.py'
      - 'tests/test_sphere_pto_config_parity.py'
      - 'tests/test_sphere_reactive_pi_parity.py'
      - 'tests/test_sphere_declutching_parity.py'
      - 'tests/test_sphere_latching_parity.py'
      - 'tests/test_case_dynamics_parity.py'
      - 'tests/test_ellipsoid_nonlinear_hydro_parity.py'
      - 'tests/test_sphere_variable_mass_parity.py'
      - 'tests/test_sphere_direct_drive_parity.py'
      - 'tests/test_rm3_direct_linear_generator_source.py'
      - 'tests/test_rm3_direct_linear_generator_parity.py'
      - 'tests/test_rm3_hydraulic_source.py'
      - 'tests/test_rm3_hydraulic_parity.py'
      - 'tests/test_oswec_hydraulic_source.py'
      - 'tests/test_oswec_hydraulic_parity.py'
      - 'tests/test_oswec_desalination_source.py'
      - 'tests/test_oswec_desalination_membrane_parity.py'
      - 'tests/test_oswec_desalination_accumulator_parity.py'
      - 'tests/test_crank.py'
      - 'tests/test_hydraulic_cylinder.py'
      - 'tests/test_hydraulic_valve.py'
      - 'tests/test_hydraulic_accumulator.py'
      - 'tests/test_hydraulic_drive.py'
      - 'tests/test_rm3_public_linear_generator_parity.py'
      - 'tests/test_gbm_source_parity.py'
      - 'tests/test_gbm_motion_parity.py'
      - 'tests/test_owc_orifice_source.py'
      - 'tests/test_sphere_mpc_source.py'
      - 'tests/test_oswec_hinge_dynamics_parity.py'
      - 'tests/test_oswec_nonhydro_parity.py'
      - 'tests/test_oswec_irregular_wave_parity.py'
      - 'tests/test_oswec_multi_wave_source.py'
      - 'tests/test_oswec_multi_wave_parity.py'
      - 'tests/test_oswec_full_directional_source.py'
      - 'tests/test_oswec_full_directional_parity.py'
      - 'tests/test_oswec_passive_yaw_parity.py'
      - 'tests/test_oswec_passive_yaw_irregular_parity.py'
      - 'tests/test_morison_fixed_parity.py'
      - 'tests/test_morison_fixed_current_parity.py'
      - 'tests/test_morison_moving_source.py'
      - 'tests/test_sphere_moving_morison_parity.py'
      - 'tests/test_sphere_wave_morison_parity.py'
      - 'tests/test_passive_yaw_configuration.py'
      - 'tests/test_sphere_dynamics_parity.py'
      - 'tests/test_sphere_elevation_import_parity.py'
      - 'wecsim/linearHeave.py'
      - 'wecsim/hingePitch.py'
      - 'wecsim/irregularWave.py'
      - 'wecsim/morison.py'
      - 'wecsim/rm3Regular.py'
      - 'wecsim/hardStops.py'
      - 'wecsim/mcr.py'
      - 'wecsim/generalDynamics.py'
      - 'wecsim/caseDynamics.py'
      - 'wecsim/controls.py'
      - 'wecsim/ptoConnections.py'
      - 'wecsim/passiveYaw.py'
      - 'wecsim/nonlinearHydro.py'
      - 'wecsim/variableHydro.py'
      - 'wecsim/directDrive.py'
      - 'wecsim/directLinearGenerator.py'
      - 'wecsim/hydraulic.py'
      - 'wecsim/crank.py'
      - 'wecsim/oswecHydraulic.py'
      - 'wecsim/desalination.py'
      - 'wecsim/rm3Hydraulic.py'
      - 'wecsim/electricGenerator.py'
      - 'wecsim/api.py'
      - 'wecsim/__init__.py'
      - 'wecsim/cli.py'
      - 'wecsim/bodyClass.py'
      - 'wecsim/gbmFloating.py'
      - 'wecsim/orifice.py'
      - 'wecsim/mpcPlant.py'
  workflow_dispatch:
    inputs:
      model:
        description: Run all models or a selected reference application
        type: choice
        options: [all, OSWEC, OSWEC_Nonhydro, OWC_ORIFICE, RM3_MCR_ARRAY, SPHERE_ELEVATION_IMPORT, MORISON_FIXED, MORISON_FIXED_CURRENT, SPHERE_MOVING_MORISON, SPHERE_MOVING_MORISON_WAVE, RM3_DD_PTO, RM3_HYDRAULIC_SOURCE, OSWEC_HYDRAULIC_SOURCE, OSWEC_DESALINATION_SOURCE, SPHERE_MPC, GBM_BARGE, SPHERE_REACTIVE_DDPTO, SPHERE_VARIABLE_MASS, ELLIPSOID_NLH_REG, ELLIPSOID_NLH_CIC, ELLIPSOID_NLH_ODE45, OSWEC_PASSIVE_YAW_IRR_CONT, OSWEC_PASSIVE_YAW_IRR, OSWEC_PASSIVE_YAW, OSWEC_VARIABLE_YAW_2DEG, OSWEC_FULL_DIR, OSWEC_MULTI_WAVE, RM3_B2B, RM3_MOORING_MATRIX, SPHERE_MEAN_DRIFT, RM3_MCR_SEASTATE, RM3_END_STOPS, RM3_END_STOPS_STEP, RM3_END_STOPS_STEP_FINE, RM3_END_STOPS_STEP_FINER, RM3_END_STOPS_FULL_FINE, RM3_END_STOPS_FULL_FINER, RM3_END_STOPS_FULL_PAIR]
        default: all

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.model == 'OWC_ORIFICE' && '["OWC_ORIFICE"]' || inputs.model == 'OSWEC' && '["OSWEC"]' || inputs.model == 'OSWEC_Nonhydro' && '["OSWEC_Nonhydro"]' || inputs.model == 'RM3_MCR_ARRAY' && '["RM3_MCR_ARRAY"]' || inputs.model == 'SPHERE_ELEVATION_IMPORT' && '["SPHERE_ELEVATION_IMPORT"]' || inputs.model == 'MORISON_FIXED' && '["MORISON_FIXED"]' || inputs.model == 'MORISON_FIXED_CURRENT' && '["MORISON_FIXED_CURRENT"]' || inputs.model == 'SPHERE_MOVING_MORISON' && '["SPHERE_MOVING_MORISON"]' || inputs.model == 'SPHERE_MOVING_MORISON_WAVE' && '["SPHERE_MOVING_MORISON_WAVE"]' || inputs.model == 'RM3_DD_PTO' && '["RM3_DD_PTO"]' || inputs.model == 'RM3_HYDRAULIC_SOURCE' && '["RM3_HYDRAULIC_SOURCE"]' || inputs.model == 'OSWEC_HYDRAULIC_SOURCE' && '["OSWEC_HYDRAULIC_SOURCE"]' || inputs.model == 'OSWEC_DESALINATION_SOURCE' && '["OSWEC_DESALINATION_SOURCE"]' || inputs.model == 'SPHERE_MPC' && '["SPHERE_MPC"]' || inputs.model == 'GBM_BARGE' && '["GBM_BARGE"]' || inputs.model == 'SPHERE_REACTIVE_DDPTO' && '["SPHERE_REACTIVE_DDPTO"]' || inputs.model == 'SPHERE_VARIABLE_MASS' && '["SPHERE_VARIABLE_MASS"]' || inputs.model == 'ELLIPSOID_NLH_REG' && '["ELLIPSOID_NLH_REG"]' || inputs.model == 'ELLIPSOID_NLH_CIC' && '["ELLIPSOID_NLH_CIC"]' || inputs.model == 'ELLIPSOID_NLH_ODE45' && '["ELLIPSOID_NLH_ODE45"]' || inputs.model == 'OSWEC_PASSIVE_YAW_IRR_CONT' && '["OSWEC_PASSIVE_YAW_IRR_CONT"]' || inputs.model == 'OSWEC_PASSIVE_YAW_IRR' && '["OSWEC_PASSIVE_YAW_IRR"]' || inputs.model == 'OSWEC_PASSIVE_YAW' && '["OSWEC_PASSIVE_YAW"]' || inputs.model == 'OSWEC_VARIABLE_YAW_2DEG' && '["OSWEC_VARIABLE_YAW_2DEG"]' || inputs.model == 'OSWEC_FULL_DIR' && '["OSWEC_FULL_DIR"]' || inputs.model == 'OSWEC_MULTI_WAVE' && '["OSWEC_MULTI_WAVE"]' || inputs.model == 'RM3_B2B' && '["RM3_B2B"]' || inputs.model == 'RM3_MOORING_MATRIX' && '["RM3_MOORING_MATRIX"]' || inputs.model == 'SPHERE_MEAN_DRIFT' && '["SPHERE_MEAN_DRIFT"]' || inputs.model == 'RM3_MCR_SEASTATE' && '["RM3_MCR_SEASTATE"]' || inputs.model == 'RM3_END_STOPS' && '["RM3_END_STOPS"]' || inputs.model == 'RM3_END_STOPS_STEP' && '["RM3_END_STOPS_STEP"]' || inputs.model == 'RM3_END_STOPS_STEP_FINE' && '["RM3_END_STOPS_STEP_FINE"]' || inputs.model == 'RM3_END_STOPS_STEP_FINER' && '["RM3_END_STOPS_STEP_FINER"]' || inputs.model == 'RM3_END_STOPS_FULL_FINE' && '["RM3_END_STOPS_FULL_FINE"]' || inputs.model == 'RM3_END_STOPS_FULL_FINER' && '["RM3_END_STOPS_FULL_FINER"]' || inputs.model == 'RM3_END_STOPS_FULL_PAIR' && '["RM3_END_STOPS_FULL_FINE", "RM3_END_STOPS_FULL_FINER"]' || '["SPHERE_ELEVATION_IMPORT", "MORISON_FIXED", "MORISON_FIXED_CURRENT", "SPHERE_MOVING_MORISON", "SPHERE_MOVING_MORISON_WAVE", "RM3_DD_PTO", "RM3", "OSWEC", "OSWEC_Nonhydro", "GBM_BARGE", "SPHERE_VARIABLE_MASS", "SPHERE_REACTIVE_DDPTO", "OSWEC_FULL_DIR", "OSWEC_MULTI_WAVE", "OSWEC_PASSIVE_YAW", "Sphere", "SPHERE_MEAN_DRIFT", "RM3_B2B", "RM3_END_STOPS", "RM3_PTO_Extension", "RM3_Radiation_Options", "Sphere_Passive", "Sphere_PTO_Config", "Sphere_Reactive_PI", "Sphere_Declutching", "Sphere_Latching", "RM3_MCR", "RM3_MCR_ARRAY", "RM3_MCR_EXCEL", "RM3_MCR_MAT", "RM3_MCR_SEASTATE", "ELLIPSOID_NLH_REG", "ELLIPSOID_NLH_CIC", "ELLIPSOID_NLH_ODE45"]') }}
    name: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: |
            source
            examples/${{ matrix.model }}
      - uses: actions/checkout@v7
        if: matrix.model == 'OWC_ORIFICE' || matrix.model == 'SPHERE_ELEVATION_IMPORT' || matrix.model == 'MORISON_FIXED' || matrix.model == 'MORISON_FIXED_CURRENT' || matrix.model == 'SPHERE_MOVING_MORISON' || matrix.model == 'SPHERE_MOVING_MORISON_WAVE' || matrix.model == 'RM3_DD_PTO' || matrix.model == 'RM3_HYDRAULIC_SOURCE' || matrix.model == 'OSWEC_HYDRAULIC_SOURCE' || matrix.model == 'OSWEC_DESALINATION_SOURCE' || matrix.model == 'SPHERE_MPC' || matrix.model == 'GBM_BARGE' || matrix.model == 'SPHERE_REACTIVE_DDPTO' || matrix.model == 'SPHERE_VARIABLE_MASS' || matrix.model == 'ELLIPSOID_NLH_REG' || matrix.model == 'ELLIPSOID_NLH_CIC' || matrix.model == 'ELLIPSOID_NLH_ODE45' || matrix.model == 'Sphere' || matrix.model == 'SPHERE_MEAN_DRIFT' || matrix.model == 'Sphere_Passive' || matrix.model == 'Sphere_PTO_Config' || matrix.model == 'Sphere_Reactive_PI' || matrix.model == 'Sphere_Declutching' || matrix.model == 'Sphere_Latching' || matrix.model == 'RM3_B2B' || matrix.model == 'RM3_MOORING_MATRIX' || matrix.model == 'RM3_END_STOPS' || matrix.model == 'RM3_END_STOPS_STEP' || matrix.model == 'RM3_END_STOPS_STEP_FINE' || matrix.model == 'RM3_END_STOPS_FULL_FINE' || matrix.model == 'RM3_END_STOPS_FULL_FINER' || matrix.model == 'RM3_END_STOPS_STEP_FINER' || matrix.model == 'RM3_PTO_Extension' || matrix.model == 'RM3_Radiation_Options' || matrix.model == 'RM3_MCR' || matrix.model == 'RM3_MCR_ARRAY' || matrix.model == 'RM3_MCR_EXCEL' || matrix.model == 'RM3_MCR_MAT' || matrix.model == 'RM3_MCR_SEASTATE' || matrix.model == 'OSWEC_Nonhydro' || matrix.model == 'OSWEC_MULTI_WAVE' || matrix.model == 'OSWEC_FULL_DIR' || matrix.model == 'OSWEC_PASSIVE_YAW' || matrix.model == 'OSWEC_VARIABLE_YAW_2DEG' || matrix.model == 'OSWEC_PASSIVE_YAW_IRR' || matrix.model == 'OSWEC_PASSIVE_YAW_IRR_CONT'
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            PTO-Sim/RM3/RM3_DD_PTO
            PTO-Sim/RM3/RM3_cHydraulic_PTO
            PTO-Sim/OSWEC/OSWEC_Hydraulic_PTO
            PTO-Sim/OSWEC/OSWEC_Hydraulic_Crank_PTO
            Desalination
            Morison_Element/morisonElement
            _Common_Input_Files/Sphere
            Free_Decay
            _Common_Input_Files/RM3
            _Common_Input_Files/OSWEC
            Nonhydro_Body
            Multiple_Wave_Spectra
            Full_Directional_Waves
            Passive_Yaw/PassiveYawOFF
            Passive_Yaw/PassiveYawON
            Passive_Yaw/PassiveYawRegression
            Variable_Hydro/Passive_Yaw
            Body-to-Body_Interactions/B2B_Case1
            Body-to-Body_Interactions/B2B_Case2
            Body-to-Body_Interactions/B2B_Case3
            Body-to-Body_Interactions/B2B_Case4
            End_Stops
            Radiation_Force_Options
            RM3_PTO_Extension
            Controls/Passive (P)
            Controls/Reactive (PI)
            Controls/ReactiveWithPTO
            Controls/Declutching
            Controls/Latching
            Multiple_Condition_Runs/RM3_MCROPT1
            Multiple_Condition_Runs/RM3_MCROPT2
            Multiple_Condition_Runs/RM3_MCROPT3
            Multiple_Condition_Runs/RM3_MCROPT3_SeaState
            Mooring/MooringMatrix
            Mean_Drift
            Variable_Hydro/Variable_Mass
            Nonlinear_Hydro
            Generalized_Body_Modes
            Controls/MPC
            OWC/OrificeModel
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: ${{ matrix.model == 'OSWEC_DESALINATION_SOURCE' && 'Simulink Simscape Simscape_Multibody Simscape_Fluids' || matrix.model == 'OWC_ORIFICE' && 'Simulink Simscape Simscape_Multibody Signal_Processing_Toolbox Control_System_Toolbox' || matrix.model == 'SPHERE_MPC' && 'Simulink Simscape Simscape_Multibody Control_System_Toolbox Optimization_Toolbox Statistics_and_Machine_Learning_Toolbox' || (matrix.model == 'SPHERE_REACTIVE_DDPTO' || matrix.model == 'Sphere_Passive' || matrix.model == 'Sphere_PTO_Config' || matrix.model == 'Sphere_Reactive_PI' || matrix.model == 'Sphere_Declutching' || matrix.model == 'Sphere_Latching') && 'Simulink Simscape Simscape_Multibody Control_System_Toolbox' || 'Simulink Simscape Simscape_Multibody' }}
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('${{ matrix.model }}')
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_morison_fixed_parity.py
        if: matrix.model == 'MORISON_FIXED'
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_morison_fixed_current_parity.py
        if: matrix.model == 'MORISON_FIXED_CURRENT'
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_morison_moving_source.py
        if: matrix.model == 'MORISON_FIXED'
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_sphere_moving_morison_parity.py
        if: matrix.model == 'SPHERE_MOVING_MORISON'
        env:
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_sphere_wave_morison_parity.py
        if: matrix.model == 'SPHERE_MOVING_MORISON_WAVE'
        env:
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_case_dynamics_parity.py
        env:
          WEC_SIM_REFERENCE_MODEL: ${{ matrix.model }}
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_ellipsoid_nonlinear_hydro_parity.py
        if: matrix.model == 'ELLIPSOID_NLH_REG' || matrix.model == 'ELLIPSOID_NLH_CIC' || matrix.model == 'ELLIPSOID_NLH_ODE45'
        env:
          WEC_SIM_REFERENCE_MODEL: ${{ matrix.model }}
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_sphere_variable_mass_parity.py
        if: matrix.model == 'SPHERE_VARIABLE_MASS'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_sphere_direct_drive_parity.py
        if: matrix.model == 'SPHERE_REACTIVE_DDPTO'
        env:
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_hydraulic_source.py tests/test_rm3_hydraulic_parity.py
        if: matrix.model == 'RM3_HYDRAULIC_SOURCE'
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
          WEC_SIM_RM3_H5: applications/_Common_Input_Files/RM3/hydroData/rm3.h5
      - run: python -m pytest -q tests/test_crank.py tests/test_oswec_hydraulic_source.py tests/test_oswec_hydraulic_parity.py
        if: matrix.model == 'OSWEC_HYDRAULIC_SOURCE'
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
          WEC_SIM_OSWEC_H5: applications/_Common_Input_Files/OSWEC/hydroData/oswec.h5
      - run: python -m pytest -q tests/test_crank.py tests/test_hydraulic_accumulator.py tests/test_oswec_desalination_source.py tests/test_oswec_desalination_membrane_parity.py tests/test_oswec_desalination_accumulator_parity.py
        if: matrix.model == 'OSWEC_DESALINATION_SOURCE'
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
          WEC_SIM_OSWEC_H5: applications/_Common_Input_Files/OSWEC/hydroData/oswec.h5
      - run: python -m pytest -q tests/test_rm3_direct_linear_generator_source.py
        if: matrix.model == 'RM3_DD_PTO'
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_direct_linear_generator_parity.py
        if: matrix.model == 'RM3_DD_PTO'
        env:
          WEC_SIM_RM3_H5: applications/_Common_Input_Files/RM3/hydroData/rm3.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_public_linear_generator_parity.py
        if: matrix.model == 'RM3_DD_PTO'
        env:
          WEC_SIM_RM3_H5: applications/_Common_Input_Files/RM3/hydroData/rm3.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_gbm_source_parity.py
        if: matrix.model == 'GBM_BARGE'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_gbm_motion_parity.py
        if: matrix.model == 'GBM_BARGE'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_owc_orifice_source.py
        if: matrix.model == 'OWC_ORIFICE'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_sphere_mpc_source.py
        if: matrix.model == 'SPHERE_MPC'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_live_current_h5.py
        if: matrix.model == 'RM3' || matrix.model == 'OSWEC'
        env:
          WEC_SIM_REFERENCE_MODEL: ${{ matrix.model }}
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
      - run: python -m pytest -q tests/test_rm3_heave_dynamics_parity.py
        if: matrix.model == 'RM3'
        env:
          WEC_SIM_REFERENCE_MODEL: RM3
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_multidof_parity.py
        if: matrix.model == 'RM3'
        env:
          WEC_SIM_REFERENCE_MODEL: RM3
          WEC_SIM_MATLAB_CORE_DIR: matlab-ref
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - run: python -m pytest -q tests/test_rm3_b2b_parity.py
        if: matrix.model == 'RM3_B2B'
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
