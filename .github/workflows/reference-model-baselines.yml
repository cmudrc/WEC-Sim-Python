  compare-end-stops-full:
    if: inputs.model == 'RM3_END_STOPS_FULL_PAIR'
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: matlab-RM3_END_STOPS_FULL_*-baseline
          path: paired-output
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_rm3_end_stops_source_convergence.py
        env:
          WEC_SIM_END_STOPS_FINE_OUTPUT_DIR: paired-output/matlab-reference-model-output
          WEC_SIM_END_STOPS_FINER_OUTPUT_DIR: paired-output/matlab-reference-model-output
